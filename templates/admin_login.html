<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded shadow w-96">
  <h2 class="text-xl font-bold text-center mb-4">Admin Login</h2>

  <form method="post">
    <input type="email" name="email" placeholder="Admin Email"
      class="w-full p-2 border mb-3" required>

    <input type="password" name="password" placeholder="Password"
      class="w-full p-2 border mb-4" required>

    <button class="w-full bg-red-600 text-white p-2 rounded">
      Login
    </button>
  </form>
</div>

</body>
</html>
